<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <style>
    .cursor { animation: cawki-cursor 3.6s steps(1, end) infinite; }
    @keyframes cawki-cursor { 75% { opacity: 0.42; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <!-- Cawki: the terminal's solid command-core C. -->
